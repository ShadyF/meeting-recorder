name: Release

# Publishing is driven by pushing a version tag, e.g.:
#   git tag -a v0.1.2 -m "v0.1.2" && git push --follow-tags
#
# Protect the `v*` tag pattern in Settings -> Tags so only maintainers can
# trigger a release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate the tag and source versions
        id: validation
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Use the same strict SemVer and dual-source validation as the container release.
          python3 scripts/container-release.py validate --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" --project-root . --github-output "$GITHUB_OUTPUT"

      - name: Run tests
        run: python3 tests/run_tests.py

      - name: Assemble release notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract this version's section from the changelog.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Release $GITHUB_REF_NAME" > notes.md
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ steps.validation.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Build flags from the validator's trusted prerelease result.
          release_args=(--title "$GITHUB_REF_NAME" --notes-file notes.md)
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease --latest=false)
          else
            release_args+=(--prerelease=false)
          fi

          # Create a generic source release once, then update it safely on reruns.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" "${release_args[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag "${release_args[@]}"
          fi
