# Replace the Wayland socket list instead of adding X11 access to it.
[Container]
Volume=

# Keep the same narrow persistent data mounts as the Wayland unit.
Volume=%h/.config/meeting-recorder:/config/meeting-recorder:Z
Volume=%h/.local/state/meeting-recorder:/state/meeting-recorder:Z
Volume=%h/.cache/meeting-recorder:/cache/meeting-recorder:Z
# Operator: change this host Recording directory to the desired destination.
Volume=%h/Videos/MeetingRecorder:%h/Videos/MeetingRecorder:Z

# Keep only the common desktop buses and the single X11 display resources.
Volume=%t/pulse/native:/run/user/%U/pulse/native:rw
Volume=%t/bus:/run/user/%U/bus:rw
Volume=/run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
# Operator: change X0 and the Xauthority path when the desktop uses another display.
Volume=/tmp/.X11-unix/X0:/tmp/.X11-unix/X0:ro
Volume=%h/.Xauthority:%h/.Xauthority:ro

# Replace Wayland session variables with the fixed X11 display configuration.
Environment=XDG_SESSION_TYPE=x11
Environment=DISPLAY=:0
Environment=XAUTHORITY=%h/.Xauthority
Environment=WAYLAND_DISPLAY=
