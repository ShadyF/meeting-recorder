name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Tests only need to read the repository.
permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The app deliberately has no pip dependencies and the test runner is
      # stdlib-only, so there is nothing to install for the unit tests.
      - name: Run tests
        run: python3 tests/run_tests.py

      - name: Byte-compile all modules
        run: python3 -m compileall -q meeting_recorder
